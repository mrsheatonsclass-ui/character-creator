const empty=()=>({panelCount:6,gender:'',age:'',skin:'',eyes:'',hairColor:'',hairType:'',hairLength:'',hairStyle:'',hairDecoration:'None',expression:'Happy',style:'Comic book illustration',palette:'Blue and white',top:'None',bottom:'None',onePiece:'None',pose:'None',activity:'None',background:'Classroom',customBackground:'',details:'',accessories:[],scenes:Array.from({length:6},()=>({include:'yes',what:'',where:'',shot:'Wide view',mood:'Bright and cheerful',details:''})),page:0,panel:0});let s=empty();try{let saved=JSON.parse(localStorage.getItem(STORE));if(saved){s={...empty(),...saved};s.panelCount=s.panelCount===3?3:6;s.scenes=Array.from({length:6},(_,i)=>({...empty().scenes[i],...(saved.scenes?.[i]||{})}));}}catch(e){}const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(s))}catch(e){}};function set(k,v){s[k]=v;save()}function setScene(k,v){s.scenes[s.panel][k]=v;save()}function sel(k,label,items=options[k],required=false){return `<div class="field"><label for="${k}">${label}${required?' *':''}</label><select id="${k}" data-key="${k}"><option value="">Choose an option</option>${items.map(v=>`<option ${s[k]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`}function swatch(k,label,items){return `<div class="field"><label>${label} *</label><div class="swatches" role="group" aria-label="${label}">${items.map(([name,color])=>`<button class="swatch" data-swatch="${k}" data-value="${esc(name)}" aria-pressed="${s[k]===name}"><span class="dot" style="background:${color}"></span>${esc(name)}</button>`).join('')}</div></div>`}function field(k,label,placeholder='',multiline=false){return `<div class="field"><label for="${k}">${label}</label>${multiline?`<textarea id="${k}" data-key="${k}" placeholder="${esc(placeholder)}">${esc(s[k])}</textarea>`:`<input id="${k}" data-key="${k}" value="${esc(s[k])}" placeholder="${esc(placeholder)}">`}</div>`}function micButton(kind,key){return `<button type="button" class="btn mic-btn" data-mic-kind="${kind}" data-mic-key="${key}" aria-label="Speak to fill ${key}">Speak instead of typing</button><p class="help">Select Speak instead of typing, say your words, then select Stop listening. For microphone access, open the app directly from an HTTPS link in Chrome.</p>`}function buttons(prev,next,nextText='Next'){return `<div class="actions"><button class="btn secondary" data-action="back">Back</button><button class="btn secondary" data-action="read">Read Aloud</button><button class="btn primary" data-action="next">${nextText}</button></div>`}const steps=['Welcome','Character basics','Hair','Clothing','Style and details','Comic panels','Review and prompts'];function header(i,title,help){return `<div class="step">Step ${i} of 6</div><h1>${title}</h1><p class="muted">${help}</p><div class="progress"><div style="width:${i/6*100}%"></div></div>`}function render(){if(s.panel>=s.panelCount)s.panel=s.panelCount-1;if(recognition){recognition.stop();recognition=null}let html='';if(s.page===0){html=`<h1>Make your own comic!</h1><p>First, design your character. Then plan what happens in each of your comic panels. You will get a separate AI image prompt for every panel.</p><div class="field"><label for="panelCount">How many comic panels do you want?</label><select id="panelCount" data-count><option value="3" ${s.panelCount===3?'selected':''}>3 panels</option><option value="6" ${s.panelCount===6?'selected':''}>6 panels</option></select></div><div class="notice">The images will have no words or speech bubbles. You will add your own dialogue and sound effects later.</div>${s.gender||s.scenes.some(x=>x.what)?`<div class="actions"><button class="btn primary" data-action="resume">Continue Creating</button><button class="btn secondary" data-action="reset">Start Over</button></div>`:`<div class="actions"><button class="btn primary" data-action="start">Start Creating</button></div>`}<div class="actions"><button class="btn secondary" data-action="read">Read Aloud</button></div>`}
if(s.page===1){html=header(1,'Design your character','Choose the basic features of your character. These choices are required.')+`<div class="grid">${sel('gender','Character description',options.gender,true)}${sel('age','Age',options.age,true)}</div>${swatch('skin','Skin tone',skin)}${swatch('eyes','Eye color',eyes)}${buttons()}`}
if(s.page===2){html=header(2,'Choose your hair','Choose your hair type, length, style, and color. There are many styles to choose from.')+`<div class="grid">${sel('hairType','Hair type',options.hairType,true)}${sel('hairLength','Hair length',options.hairLength,true)}${sel('hairStyle','Hairstyle',options.hairStyle,true)}${sel('hairDecoration','Hair decorations (optional)')}</div>${swatch('hairColor','Hair color',hairs)}${buttons()}`}
if(s.page===3){html=header(3,'Choose your outfit','Clothing is optional. Choose a top and bottom, or choose one complete outfit. Colors and shoes will match automatically.')+`<div class="grid">${sel('top','Top')}${sel('bottom','Bottom')}${sel('onePiece','One-piece outfit or swimwear',options.onePiece.filter(v=>v!=='One-piece swimsuit'||s.gender==='Girl').filter(v=>v!=='Board shorts'||s.gender==='Boy'))}</div><p class="help">For swimming, choose a one-piece swimsuit for a girl or board shorts for a boy.</p>${buttons()}`}
if(s.page===4){html=header(4,'Choose your comic style','Your art style and colors will stay consistent in every panel.')+`<div class="grid">${sel('style','Art style')}${sel('expression','Facial expression')}${sel('pose','Starting pose')}${sel('activity','Starting activity')}${sel('background','Starting background')}</div><div class="field"><label>Choose your comic color scheme</label><p class="help">Pick two colors to use throughout all ${s.panelCount} panels.</p><div class="swatches">${palettes.map(([name,a,b])=>`<button class="swatch palette-choice" data-palette="${esc(name)}" aria-pressed="${s.palette===name}"><span class="palette-dots"><span style="background:${a}"></span><span style="background:${b}"></span></span>${esc(name)}</button>`).join('')}</div></div>${s.background==='Other'?field('customBackground','Describe your background','Example: a colorful treehouse'):''}<div class="field"><label>Accessories (optional, choose more than one)</label>${['Hat','Backpack','Watch','Necklace','Bracelet','Glasses','Freckles','Braces','Dimples'].map(v=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:6px 12px 6px 0"><input type="checkbox" data-accessory="${v}" ${s.accessories.includes(v)?'checked':''}>${v}</label>`).join('')}</div>${field('details','Add more character details (optional)','Something special about your character',true)}${micButton('character','details')}${buttons()}`}
if(s.page===5){let q=s.scenes[s.panel];html=header(5,`Plan your ${s.panelCount} comic panels`,'Describe what happens in each panel. The app will create a separate image prompt for each one.')+`<div class="panelnav">${s.scenes.slice(0,s.panelCount).map((x,i)=>`<button class="${s.panel===i?'active':''} ${x.what.trim()?'done':''}" data-panel="${i}">Panel ${i+1}${x.what.trim()?' ✓':''}</button>`).join('')}</div><h2>Panel ${s.panel+1}</h2><div class="field"><label for="include">Is your character in this panel?</label><select id="include" data-scene="include"><option value="yes" ${q.include==='yes'?'selected':''}>Yes, show my character</option><option value="no" ${q.include==='no'?'selected':''}>No, show the scene without my character</option></select></div><div class="field"><label for="what">What is happening in this panel? *</label><textarea id="what" data-scene="what" placeholder="Example: A mysterious box is sitting under a tree.">${esc(q.what)}</textarea><p class="help">Describe what we should SEE. You do not need to write dialogue.</p>${micButton('scene','what')}</div><div class="field"><label for="where">Where does this panel take place? (optional)</label><input id="where" data-scene="where" placeholder="Example: behind the school" value="${esc(q.where)}">${micButton('scene','where')}</div><div class="grid"><div class="field"><label for="shot">Camera view</label><select id="shot" data-scene="shot">${options.shot.map(v=>`<option ${q.shot===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="mood">Scene feeling</label><select id="mood" data-scene="mood">${options.mood.map(v=>`<option ${q.mood===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label for="sceneDetails">Extra scene details (optional)</label><textarea id="sceneDetails" data-scene="details" placeholder="Example: a red kite is caught in the tree">${esc(q.details)}</textarea>${micButton('scene','details')}</div><div class="actions"><button class="btn secondary" data-action="back">${s.panel===0?'Back to Character':'Previous Panel'}</button><button class="btn secondary" data-action="read">Read Aloud</button><button class="btn primary" data-action="next">${s.panel===s.panelCount-1?'Review My Comic':'Next Panel'}</button></div>`}
if(s.page===6){html=header(6,'Review and copy your prompts','Check each scene. Copy each prompt separately into your AI image generator.')+`<div class="summary"><h3>Your character</h3><p>${esc(character())}</p><p><b>Comic color scheme:</b> ${esc(s.palette)}</p><button class="btn secondary" data-action="edit-character">Edit My Character</button></div><div class="notice">Read your descriptions before copying. Each panel uses the same art style and color palette. Add your own dialogue, speech bubbles, and sound effects after creating the images.</div>${s.scenes.slice(0,s.panelCount).map((q,i)=>`<section class="summary"><h2>Panel ${i+1}</h2><p><b>Your scene:</b> ${esc(q.what||'(Not described yet)')}</p><button class="btn secondary" data-editpanel="${i}">Edit Panel ${i+1}</button><div class="wordcount">${wordCount(prompt(i))} of 225 words maximum</div><div class="prompt" id="prompt${i}">${esc(prompt(i))}</div><div class="actions"><button class="btn primary" data-copy="${i}">Copy Panel ${i+1} Prompt</button><button class="btn secondary" data-readprompt="${i}">Read Prompt</button></div><div class="status" id="status${i}" aria-live="polite"></div></section>`).join('')}<div class="actions"><button class="btn secondary" data-action="reset">Start Over</button></div>`}
app.innerHTML=html;bind()}
function character(){let parts=[`a ${s.age||'school-age'}-year-old ${s.gender.toLowerCase()||'child'}`,`${s.skin||'natural'} skin tone`,`${s.eyes||'natural'} eyes`];if(s.hairLength==='Bald'||s.hairType==='No hair')parts.push('a bald head');else parts.push(`${s.hairLength.toLowerCase()} ${s.hairColor.toLowerCase()} ${s.hairType.toLowerCase()} hair in a ${s.hairStyle.toLowerCase()} hairstyle${s.hairDecoration!=='None'?' with '+s.hairDecoration.toLowerCase():''}`);let outfit=s.onePiece!=='None'?s.onePiece:[s.top,s.bottom].filter(x=>x!=='None').join(' and ');if(outfit)parts.push(`wearing ${outfit.toLowerCase()} with coordinating colors and appropriate shoes`);if(s.accessories.length)parts.push(`with ${s.accessories.join(', ').toLowerCase()}`);if(s.expression)parts.push(`a ${s.expression.toLowerCase()} expression`);if(s.details.trim())parts.push(s.details.trim());return parts.join(', ')+'.'}
function wordCount(t){return (t.trim().match(/\S+/g)||[]).length}
function limitedPrompt(parts,limit=225){let output='';for(let part of parts){part=String(part||'').trim();if(!part)continue;let available=limit-wordCount(output);if(available<=0)break;let words=part.match(/\S+/g)||[];if(words.length>available)part=words.slice(0,available).join(' ');output+=(output?'\n\n':'')+part;}return output}
function prompt(i){let q=s.scenes[i];let setting=q.where.trim()||(s.background==='Other'?s.customBackground:s.background);let scene=q.what.trim()||'A scene from the story.';let char=q.include==='yes'?`Show the same character: ${character()} Maintain the same face, hairstyle, outfit and accessories across panels.`:'Do not show the main character in this panel.';let constraints='No text, letters, numbers, captions, speech bubbles, thought bubbles, dialogue, sound effects or watermarks. Leave room for students to add their own words later.';
// Put mandatory image rules and the student's scene first so long descriptions never push them out.
return limitedPrompt([`Panel ${i+1} of ${s.panelCount}. Create one vertical comic illustration in ${s.style.toLowerCase()} style. Use ${s.palette.toLowerCase()} as the dominant colors, with consistent linework and shading across all ${s.panelCount} panels.`,constraints,`Action: ${scene}`,`Setting: ${setting||'appropriate to the action'}. Camera: ${q.shot}. Mood: ${q.mood}.`,char,q.details.trim()?`Extra scene details: ${q.details.trim()}`:''],225)}
function read(text){if(!('speechSynthesis'in window)){alert('Read Aloud is unavailable in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.88;u.lang='en-US';speechSynthesis.speak(u)}function speakPage(){let labels=[...app.querySelectorAll('h1,h2,.muted,label,.help')].map(x=>x.textContent.trim());let selects=[...app.querySelectorAll('select')].map(x=>`${x.closest('.field')?.querySelector('label')?.textContent||'Choices'}: ${[...x.options].map(o=>o.text).join(', ')}`);read([...new Set([...labels,...selects])].join('. '))}function validate(){if(s.page===1){let missing=[['gender','character description'],['age','age'],['skin','skin tone'],['eyes','eye color']].filter(([k])=>!s[k]);if(missing.length){alert('Please choose your '+missing.map(x=>x[1]).join(', ')+'.');return false}}if(s.page===2){let missing=['hairType','hairLength','hairStyle','hairColor'].filter(k=>!s[k]);if(missing.length){alert('Please finish your hair choices.');return false}}if(s.page===5&&!s.scenes[s.panel].what.trim()){alert('Please describe what happens in panel '+(s.panel+1)+'.');return false}return true}
let recognition=null;let activeMic=null;
function startMic(button){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const kind=button.dataset.micKind,key=button.dataset.micKey;
 const target=kind==='scene'?app.querySelector(`[data-scene="${key}"]`):app.querySelector(`[data-key="${key}"]`);
 const help=button.nextElementSibling;
 const feedback=message=>{if(help)help.textContent=message};
 if(recognition){recognition.stop();return}
 if(!target)return;
 if(!SR){feedback('Speech input is unavailable in this browser. Open the published app directly in Chrome and try again.');return}
 if(!window.isSecureContext){feedback('Microphone needs a secure HTTPS website. Publish the app and open its direct link in Chrome.');return}
 let r=new SR();recognition=r;activeMic=button;
 r.lang='en-US';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
 let original=target.value.trim(),finalText='';
 const update=transcript=>{let text=[original,transcript.trim()].filter(Boolean).join(' ').trim();target.value=text;if(kind==='scene')setScene(key,text);else set(key,text)};
 r.onstart=()=>{button.classList.add('listening');button.textContent='Stop listening';feedback('Listening. Speak clearly, then select Stop listening.')};
 r.onresult=e=>{let interim='';for(let i=0;i<e.results.length;i++){let phrase=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=phrase+' ';else interim+=phrase}update(finalText+interim)};
 r.onerror=e=>{let messages={'not-allowed':'Microphone permission was denied. Allow microphone access in your browser settings and open the app directly.','service-not-allowed':'Speech recognition is blocked by the browser or school settings. Open the app directly in Chrome.','audio-capture':'No microphone was found. Check the Chromebook microphone settings.','network':'Speech recognition needs a network connection. Check your internet connection.','no-speech':'No speech was heard. Try again and speak clearly.','aborted':'Speech recognition stopped.'};feedback(messages[e.error]||('Microphone error: '+e.error));};
 r.onend=()=>{button.classList.remove('listening');button.textContent='Speak instead of typing';if(recognition===r)recognition=null;activeMic=null;if(help&&help.textContent.startsWith('Listening'))feedback(finalText.trim()?'Your words were added. You may edit them.':'Tap Speak instead of typing to try again.')};
 try{r.start()}catch(e){recognition=null;button.classList.remove('listening');feedback('Unable to start microphone. Try the direct HTTPS app link in Chrome.')}
}
function bind(){app.querySelectorAll('[data-count]').forEach(el=>el.addEventListener('change',()=>{s.panelCount=Number(el.value)===3?3:6;s.panel=Math.min(s.panel,s.panelCount-1);save();render()}));app.querySelectorAll('[data-mic-kind]').forEach(el=>el.addEventListener('click',()=>startMic(el)));app.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{set(el.dataset.key,el.value);if(el.dataset.key==='background'||el.dataset.key==='gender')render()}));app.querySelectorAll('[data-swatch]').forEach(el=>el.addEventListener('click',()=>{set(el.dataset.swatch,el.dataset.value);render()}));app.querySelectorAll('[data-palette]').forEach(el=>el.addEventListener('click',()=>{set('palette',el.dataset.palette);render()}));app.querySelectorAll('[data-accessory]').forEach(el=>el.addEventListener('change',()=>{s.accessories=el.checked?[...s.accessories,el.dataset.accessory]:s.accessories.filter(v=>v!==el.dataset.accessory);save()}));app.querySelectorAll('[data-scene]').forEach(el=>el.addEventListener('input',()=>setScene(el.dataset.scene,el.value)));app.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',()=>{s.panel=+el.dataset.panel;save();render()}));app.querySelectorAll('[data-editpanel]').forEach(el=>el.addEventListener('click',()=>{s.page=5;s.panel=+el.dataset.editpanel;save();render()}));app.querySelectorAll('[data-copy]').forEach(el=>el.addEventListener('click',async()=>{let i=+el.dataset.copy;let val=prompt(i);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(val)}else{let t=document.createElement('textarea');t.value=val;document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}document.getElementById('status'+i).textContent='Prompt copied! You’re ready to create panel '+(i+1)+'!'}catch(e){let node=document.getElementById('prompt'+i);let range=document.createRange();range.selectNodeContents(node);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.getElementById('status'+i).textContent='Select and copy the highlighted prompt using Ctrl+C.'}}));app.querySelectorAll('[data-readprompt]').forEach(el=>el.addEventListener('click',()=>read(prompt(+el.dataset.readprompt))));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{let a=el.dataset.action;if(a==='read'){speakPage();return}if(a==='reset'){s=empty();try{localStorage.removeItem(STORE)}catch(e){}save();render();window.scrollTo(0,0);return}if(a==='start'){s.page=1}else if(a==='resume'){s.page=Math.max(1,s.page)}else if(a==='edit-character'){s.page=1}else if(a==='back'){if(s.page===5&&s.panel>0)s.panel--;else if(s.page===6){s.page=5;s.panel=s.panelCount-1}else s.page=Math.max(0,s.page-1)}else if(a==='next'){if(!validate())return;if(s.page===5){if(s.panel<s.panelCount-1)s.panel++;else s.page=6}else s.page=Math.min(6,s.page+1)}save();render();window.scrollTo(0,0)}))}render();
</script></body></html>
